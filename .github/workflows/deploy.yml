# Builds the site and publishes it to GitHub Pages on every push to main.
#
# Requires Settings -> Pages -> Source to be set to "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs to read the repo, mint an OIDC token for the deployment,
# and write the Pages artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

# Runner images are pinned rather than tracking ubuntu-latest, and every action
# is pinned to a full commit SHA rather than a mutable tag, so neither a GitHub
# image roll nor a retagged action can change what runs here without a reviewed
# commit. Dependabot (.github/dependabot.yml) proposes the bumps.
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go run . build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
