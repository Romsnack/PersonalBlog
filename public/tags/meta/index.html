<script>
(function () {
  var d = document.documentElement;
  var btn = document.querySelector(".theme-toggle");
  var name = btn.querySelector(".theme-name");

  function paint() {
    var light = d.dataset.theme === "light";
    name.textContent = light ? "light" : "dark";
    btn.setAttribute("aria-label", "Switch to " + (light ? "dark" : "light") + " theme");
  }

  btn.addEventListener("click", function () {
    var light = d.dataset.theme !== "light";
    if (light) { d.dataset.theme = "light"; } else { delete d.dataset.theme; }
    try { localStorage.setItem("theme", light ? "light" : "dark"); } catch (e) {}
    paint();
  });

  paint();
})();
</script>
