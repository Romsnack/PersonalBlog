<!doctype html>
<html lang="{{.Site.Config.Language}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{if .Title}}{{.Title}} · {{end}}{{.Site.Config.Title}}</title>
<meta name="description" content="{{.Description}}">
<link rel="canonical" href="{{absURL .Path}}">
<link rel="stylesheet" href="{{url "/style.css"}}">
<link rel="stylesheet" href="{{url "/chroma.css"}}">
<link rel="alternate" type="application/atom+xml" title="{{.Site.Config.Title}}" href="{{url "/atom.xml"}}">
<meta property="og:type" content="{{if .Post}}article{{else}}website{{end}}">
<meta property="og:title" content="{{if .Title}}{{.Title}}{{else}}{{.Site.Config.Title}}{{end}}">
<meta property="og:description" content="{{.Description}}">
<meta property="og:url" content="{{absURL .Path}}">
<script>
// Runs before first paint so a light-theme reader never sees a dark flash.
// Adding .js here also reveals the toggle, which is useless without scripting.
(function () {
  var d = document.documentElement;
  d.classList.add("js");
  try { var t = localStorage.getItem("theme"); if (t === "light") d.dataset.theme = t; } catch (e) {}
})();
</script>
</head>
<body>
<header class="site-header">
  <a class="wordmark" href="{{url "/"}}">{{.Site.Config.Title}}</a>
  <nav>
    <a href="{{url "/"}}">posts</a>
    <a href="{{url "/tags/"}}">tags</a>
    {{range .Site.Pages}}<a href="{{url .Path}}">{{.Slug}}</a>{{end}}
    <button class="theme-toggle" type="button" aria-label="Switch to light theme">
      <span class="bracket">[</span><span class="theme-name">dark</span><span class="bracket">]</span>
    </button>
  </nav>
</header>

<main>
{{template "content" .}}
</main>

<footer class="site-footer">
  <span>© {{year}} {{.Site.Config.Author}} · <a rel="license" href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a></span>
  <nav class="footer-links">
    {{range .Site.Config.Links}}<a href="{{.URL}}" rel="me">{{.Name}}</a>
    {{end}}<a href="{{url "/atom.xml"}}">atom</a>
  </nav>
</footer>
<script>
(function () {
  var d = document.documentElement;
  var btn = document.querySelector(".theme-toggle");
  var name = btn.querySelector(".theme-name");

  function paint() {
    var light = d.dataset.theme === "light";
    name.textContent = light ? "light" : "dark";
    btn.setAttribute("aria-label", "Switch to " + (light ? "dark" : "light") + " theme");
  }

  btn.addEventListener("click", function () {
    var light = d.dataset.theme !== "light";
    if (light) { d.dataset.theme = "light"; } else { delete d.dataset.theme; }
    try { localStorage.setItem("theme", light ? "light" : "dark"); } catch (e) {}
    paint();
  });

  paint();
})();
</script>
{{if .Site.Config.Dev}}<script>new EventSource("/_livereload").onmessage = () => location.reload()</script>{{end}}
</body>
</html>
