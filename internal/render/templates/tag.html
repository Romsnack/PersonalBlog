{{define "content"}}
<h1>#{{.Tag.Name}}</h1>
<ul class="post-list">
{{range .Posts}}
  <li class="post-item">
    <a class="post-link" href="{{url .Path}}"><span class="glyph" aria-hidden="true">▸</span>{{.Title}}</a>
    <p class="meta"><time datetime="{{rfc3339 .Date}}">{{date .Date}}</time> · {{.ReadingTime}} min</p>
  </li>
{{end}}
</ul>
<p class="back"><a href="{{url "/tags/"}}">← all tags</a></p>
{{end}}
